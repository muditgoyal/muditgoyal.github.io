<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found &mdash; Mudit Goyal</title>
  <meta name="description" content="That page doesn't exist.">
  <meta property="og:title" content="Not found &mdash; Mudit Goyal">
  <meta property="og:url" content="https://muditgoyal.com/404.html">
  <meta property="og:type" content="website">
  <link rel="shortcut icon" href="/assets/fav.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #fafafa;
      --foreground: #171717;
      --font-serif: "EB Garamond", Georgia, serif;
      --font-sans: "DM Sans", system-ui, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-serif);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 420px;
    }

    .code {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin: 0 0 32px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: -0.8px;
      margin: 0 0 24px;
    }

    p {
      font-size: 18px;
      line-height: 1.65;
      margin: 0 0 40px;
    }

    a.back {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--foreground);
      text-decoration: none;
      border-bottom: 1px solid rgba(23, 23, 23, 0.3);
      padding-bottom: 4px;
      transition: border-color 0.15s ease;
    }

    a.back:hover {
      border-bottom-color: var(--foreground);
    }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>There&rsquo;s nothing at this address.</h1>
    <p>The page either moved or never existed. No harm done.</p>
    <a class="back" href="/">Back to home</a>
  </main>
</body>
</html>
